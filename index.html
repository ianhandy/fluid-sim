<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fluid Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: #0b1520; }
canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }

.controls {
    position: fixed;
    top: 12px;
    right: 12px;
    background: rgba(14,26,40,0.9);
    border: 1px solid rgba(136,192,208,0.1);
    border-radius: 8px;
    padding: 16px;
    color: #b0dce8;
    font: 13px/1.6 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-width: 220px;
    z-index: 10;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.3s ease, opacity 0.3s ease;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.controls.hidden {
    transform: translateX(calc(100% + 20px));
    opacity: 0;
    pointer-events: none;
}
.controls h3 {
    color: #d0eef5;
    font-size: 14px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
}
.control-group {
    margin-bottom: 10px;
}
.control-group label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    font-size: 12px;
}
.control-group label span.val {
    color: #88c0d0;
    font-variant-numeric: tabular-nums;
}
input[type="range"] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(136,192,208,0.15);
    border-radius: 2px;
    outline: none;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #88c0d0;
    cursor: pointer;
}
select {
    width: 100%;
    background: rgba(136,192,208,0.1);
    color: #b0dce8;
    border: 1px solid rgba(136,192,208,0.1);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    outline: none;
}
.menu-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(14,26,40,0.85);
    border: 1px solid rgba(136,192,208,0.1);
    border-radius: 8px;
    color: #b0dce8;
    font: 500 12px/1 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 10px 14px;
    cursor: pointer;
    z-index: 11;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}
.menu-btn.visible {
    opacity: 1;
    pointer-events: auto;
}
.menu-btn:hover {
    background: rgba(136,192,208,0.15);
    border-color: rgba(136,192,208,0.25);
}
.controls .ctrl-btn {
    width: 100%;
    padding: 8px 10px;
    background: rgba(136,192,208,0.1);
    border: 1px solid rgba(136,192,208,0.1);
    border-radius: 6px;
    color: #b0dce8;
    font: 500 12px/1 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    transition: background 0.2s, border-color 0.2s;
    margin-top: 8px;
}
.controls .ctrl-btn:hover {
    background: rgba(136,192,208,0.15);
    border-color: rgba(136,192,208,0.25);
}
.citation {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(136,192,208,0.1);
    font-size: 10px;
    line-height: 1.5;
    color: #6a96a5;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button class="menu-btn" id="menuBtn">Menu</button>

<div class="controls hidden" id="controls">
    <h3>Fluid Controls</h3>

    <div class="control-group">
        <label>Viscosity <span class="val" id="viscVal">0.3</span></label>
        <input type="range" id="viscosity" min="0" max="5" step="0.1" value="0.3">
    </div>

    <div class="control-group">
        <label>Curl <span class="val" id="curlVal">30</span></label>
        <input type="range" id="curl" min="0" max="50" step="1" value="30">
    </div>

    <div class="control-group">
        <label>Pressure Iterations <span class="val" id="pressVal">20</span></label>
        <input type="range" id="pressure" min="1" max="60" step="1" value="20">
    </div>

    <div class="control-group">
        <label>Splat Radius <span class="val" id="splatVal">0.25</span></label>
        <input type="range" id="splatRadius" min="0.05" max="1.0" step="0.01" value="0.25">
    </div>

    <div class="control-group">
        <label>Splat Force <span class="val" id="forceVal">6000</span></label>
        <input type="range" id="splatForce" min="500" max="15000" step="100" value="6000">
    </div>

    <div class="control-group">
        <label>Dissipation <span class="val" id="dissVal">0.97</span></label>
        <input type="range" id="dissipation" min="0.9" max="1.0" step="0.005" value="0.97">
    </div>

    <div class="control-group">
        <label>Bloom Intensity <span class="val" id="bloomVal">0.4</span></label>
        <input type="range" id="bloomIntensity" min="0" max="1.5" step="0.05" value="0.4">
    </div>

    <div class="control-group">
        <label>Bloom Threshold <span class="val" id="bloomThreshVal">0.6</span></label>
        <input type="range" id="bloomThreshold" min="0.1" max="1.5" step="0.05" value="0.6">
    </div>

    <div class="control-group">
        <label>Color Mode</label>
        <select id="colorMode">
            <option value="polarnight" selected>Polar Night</option>
            <option value="rainbow">Rainbow</option>
            <option value="monochrome">Monochrome</option>
            <option value="neon">Neon</option>
        </select>
    </div>

    <button class="ctrl-btn" id="btnSave">Save</button>

    <div class="citation">Navier-Stokes equations. GPU implementation inspired by Jos Stam, "Stable Fluids" (SIGGRAPH 1999).</div>
</div>

<script src="fluid.js"></script>
</body>
</html>
