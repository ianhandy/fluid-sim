<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fluid Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: #000; }
canvas { width: 100vw; height: 100vh; display: block; }

.controls {
    position: fixed;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 16px;
    color: #ccc;
    font: 13px/1.6 -apple-system, sans-serif;
    min-width: 220px;
    z-index: 10;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.3s ease, opacity 0.3s ease;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
}
.controls.hidden {
    transform: translateX(calc(100% + 20px));
    opacity: 0;
    pointer-events: none;
}
.controls h3 {
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
}
.control-group {
    margin-bottom: 10px;
}
.control-group label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    font-size: 12px;
}
.control-group label span.val {
    color: #888;
    font-variant-numeric: tabular-nums;
}
input[type="range"] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    outline: none;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
}
select {
    width: 100%;
    background: rgba(255,255,255,0.1);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    outline: none;
}
.toggle-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button class="toggle-btn" id="toggleBtn" title="Toggle controls">&#9881;</button>

<div class="controls" id="controls">
    <h3>Fluid Controls</h3>

    <div class="control-group">
        <label>Viscosity <span class="val" id="viscVal">0.3</span></label>
        <input type="range" id="viscosity" min="0" max="5" step="0.1" value="0.3">
    </div>

    <div class="control-group">
        <label>Curl <span class="val" id="curlVal">30</span></label>
        <input type="range" id="curl" min="0" max="50" step="1" value="30">
    </div>

    <div class="control-group">
        <label>Pressure Iterations <span class="val" id="pressVal">20</span></label>
        <input type="range" id="pressure" min="1" max="60" step="1" value="20">
    </div>

    <div class="control-group">
        <label>Splat Radius <span class="val" id="splatVal">0.25</span></label>
        <input type="range" id="splatRadius" min="0.05" max="1.0" step="0.01" value="0.25">
    </div>

    <div class="control-group">
        <label>Splat Force <span class="val" id="forceVal">6000</span></label>
        <input type="range" id="splatForce" min="500" max="15000" step="100" value="6000">
    </div>

    <div class="control-group">
        <label>Dissipation <span class="val" id="dissVal">0.97</span></label>
        <input type="range" id="dissipation" min="0.9" max="1.0" step="0.005" value="0.97">
    </div>

    <div class="control-group">
        <label>Bloom Intensity <span class="val" id="bloomVal">0.4</span></label>
        <input type="range" id="bloomIntensity" min="0" max="1.5" step="0.05" value="0.4">
    </div>

    <div class="control-group">
        <label>Bloom Threshold <span class="val" id="bloomThreshVal">0.6</span></label>
        <input type="range" id="bloomThreshold" min="0.1" max="1.5" step="0.05" value="0.6">
    </div>

    <div class="control-group">
        <label>Color Mode</label>
        <select id="colorMode">
            <option value="funforrest" selected>FunForrest</option>
            <option value="rainbow">Rainbow</option>
            <option value="monochrome">Monochrome</option>
            <option value="neon">Neon</option>
        </select>
    </div>
</div>

<script src="fluid.js"></script>
</body>
</html>
